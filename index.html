<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="David 的 GIS 软件、ArcGIS Pro 工具与空间智能实践入口。">
  <meta name="theme-color" content="#f8fbff">
  <title>DvSpatial · GIS 工具入口</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIINfQ3ynHTeDVSZhKjMZQzMZp8p3QfX8hA=" crossorigin="">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-layout">
      <a class="brand" href="./" aria-label="DvSpatial 首页">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand-copy">
          <strong>DvSpatial</strong>
          <small>INDEPENDENT GIS SOFTWARE</small>
        </span>
      </a>

      <nav class="site-nav" id="site-nav" aria-label="主导航">
        <a href="#tool-wheel"><i aria-hidden="true">◇</i> Products</a>
        <a href="https://github.com/SpDDoggy/DemStudio" target="_blank" rel="noreferrer"><i aria-hidden="true">▱</i> DEM Studio</a>
        <a href="https://github.com/SpDDoggy" target="_blank" rel="noreferrer"><i aria-hidden="true">GH</i> GitHub</a>
      </nav>

      <button class="header-cta" type="button" data-cycle="next">
        <span class="grid-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        浏览产品
      </button>

      <button class="menu-toggle" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="site-nav">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main class="landing" id="main">
    <div class="map-layer" aria-hidden="true">
      <div id="hero-map"></div>
      <div class="map-wash"></div>
    </div>

    <span class="crosshair crosshair-a" aria-hidden="true"></span>
    <span class="crosshair crosshair-b" aria-hidden="true"></span>

    <div class="shell hero-layout">
      <section class="hero-copy" aria-labelledby="hero-title">
        <p class="eyebrow"><span aria-hidden="true">✧</span> DAVID'S GEOSPATIAL TOOLSET</p>
        <h1 id="hero-title">Tools for<br><em>spatial work.</em></h1>
        <p class="hero-intro">由 David 独立设计和维护的 GIS 软件、<br>ArcGIS Pro 工具与空间智能实践。</p>

        <div class="hero-actions">
          <button class="button button-primary" type="button" data-cycle="next">
            <span class="grid-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            浏览全部产品
          </button>
          <a class="button button-secondary" href="https://github.com/SpDDoggy" target="_blank" rel="noreferrer">
            <span class="github-dot" aria-hidden="true">GH</span>
            GitHub
          </a>
        </div>
      </section>

      <section class="tool-navigator" aria-label="产品导航">
        <div class="compass-label compass-north" aria-hidden="true"><b>0°</b><span>N</span></div>
        <div class="compass-label compass-east" aria-hidden="true"><b>90°</b><span>E</span></div>
        <div class="compass-label compass-south" aria-hidden="true"><b>180°</b><span>S</span></div>
        <div class="compass-label compass-west" aria-hidden="true"><b>270°</b><span>W</span></div>

        <div class="wheel" id="tool-wheel" data-active="0">
          <div class="tick-ring" aria-hidden="true"></div>
          <svg class="segment-layer" viewBox="0 0 100 100" aria-hidden="true">
            <g data-segment-paths></g>
          </svg>
          <div class="segment-controls" data-segment-controls></div>

          <div class="wheel-center" aria-live="polite">
            <h2 data-active-name>DvStudio</h2>
            <p data-active-description>ArcGIS Pro Add-in</p>
            <span class="active-badge"><i></i> Active</span>
            <button type="button" data-cycle="next" aria-label="下一个产品">→</button>
          </div>
        </div>

        <div class="navigator-controls">
          <button type="button" data-cycle="previous" aria-label="上一个产品">‹</button>
          <p><strong data-current-index>01</strong><span data-total-count>/ 00</span></p>
          <button type="button" data-cycle="next" aria-label="下一个产品">›</button>
        </div>
      </section>
    </div>

    <p class="map-credit">
      © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a>
      © <a href="https://carto.com/attributions" target="_blank" rel="noreferrer">CARTO</a>
    </p>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="assets/js/pages/home.js"></script>
</body>
</html>
