<!doctype html>
<html lang="zh-CN" data-theme="light" data-page="home">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="David 的 GIS 软件、ArcGIS Pro 工具与空间智能实践入口。">
  <meta name="theme-color" content="#f8fbff">
  <title>DvSpatial</title>
  <script src="assets/js/components/theme-boot.js?v=20260729-3"></script>
  <link rel="icon" href="assets/images/brand/favicon.svg?v=20260728-5" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/site.css?v=20260729-3">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skipLink">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-layout">
      <a class="brand" href="./" aria-label="DvSpatial 首页" data-aria-en="DvSpatial home">
        <strong><span>Dv</span>Spatial</strong>
      </a>

      <div data-site-tools></div>
    </div>
  </header>

  <main class="landing" id="main">
    <div class="map-layer" aria-hidden="true">
      <img id="hero-map" src="assets/images/spatial/fictional-river-delta-v1.png?v=20260729-2"
           width="1672" height="941" alt="" fetchpriority="high" decoding="async">
      <div class="map-wash"></div>
    </div>

    <span class="crosshair crosshair-a" aria-hidden="true"></span>
    <span class="crosshair crosshair-b" aria-hidden="true"></span>

    <div class="shell hero-layout">
      <section class="hero-copy" aria-labelledby="hero-title">
        <h1 id="hero-title"><span data-i18n="titleLead">尽力让地理数据</span><em data-i18n="titleAccent">触手可及</em></h1>
        <p class="hero-intro" data-i18n="intro">DvStudio 与 GDB Previewer：围绕 ArcGIS Pro 工作流和空间数据查看打造的独立工具。</p>

        <div class="hero-actions">
          <a class="button button-primary" href="downloads/">
            <span data-i18n="downloadSpace">下载空间</span>
            <span class="button-arrow" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M12 3v11"></path>
                <path d="m8 10 4 4 4-4"></path>
                <path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"></path>
              </svg>
            </span>
          </a>
        </div>
      </section>

      <section class="tool-navigator" aria-label="产品导航" data-i18n-aria="productNavigation">
        <div class="compass-label compass-north" aria-hidden="true"><b>0°</b><span>N</span></div>
        <div class="compass-label compass-east" aria-hidden="true"><b>90°</b><span>E</span></div>
        <div class="compass-label compass-south" aria-hidden="true"><b>180°</b><span>S</span></div>
        <div class="compass-label compass-west" aria-hidden="true"><b>270°</b><span>W</span></div>

        <div class="wheel" id="tool-wheel" data-active="0">
          <div class="tick-ring" aria-hidden="true"></div>
          <svg class="segment-layer" viewBox="0 0 100 100" aria-hidden="true">
            <g data-segment-paths></g>
          </svg>
          <div class="segment-controls" data-segment-controls></div>

          <div class="wheel-center" aria-live="polite">
            <h2 data-active-name>DvStudio</h2>
          </div>
        </div>
      </section>
    </div>

  </main>

  <script type="module" src="assets/js/pages/home.js?v=20260729-3"></script>
</body>
</html>
